services:
  invidious:
    image: quay.io/invidious/invidious:latest
    ports:
      - "3000:3000"

    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432

        check_tables: true

        invidious_companion:
          - private_url: "http://companion:8282/companion"

        invidious_companion_key: "c3c7c583e7d2466f"
        hmac_key: "e1ba1904ba4549bdbb263b657fbfb14a313c00b7"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    environment:
      SERVER_SECRET_KEY: "6a95e363889e47c2"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
